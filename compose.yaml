name: linklens-local
services:
  db:
    image: postgres:17-alpine
    env_file: .env.db
    environment:
      POSTGRES_USER: linklens
      POSTGRES_DB: linklens
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - linklens_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linklens -d linklens']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  linklens_postgres:
